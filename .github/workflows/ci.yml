name: Backend CI

on:
  push:
    branches: ["main", "develop", "feature/*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: clc_user
          POSTGRES_PASSWORD: clc_password_test
          POSTGRES_DB: clc_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U clc_user -d clc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clc_user:clc_password_test@localhost:5432/clc_test
      NODE_ENV: test
      PORT: "3000"
      API_VERSION: v1
      CORS_ORIGIN: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Run tests
        working-directory: backend
        run: npm test
