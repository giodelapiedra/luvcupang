# Production overlay — no source mounts, no hot-reload, restart always.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: always
    ports: []   # do not expose Postgres to the host in prod
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    restart: always
    volumes: []  # no source mount — use the built image
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:1.27-alpine
    container_name: clc-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
