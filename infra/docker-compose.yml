# Compose Spec — `version` key intentionally omitted (deprecated in Compose v2).
services:
  postgres:
    image: postgres:15-alpine
    container_name: clc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clc_user
      POSTGRES_PASSWORD: clc_password_dev
      POSTGRES_DB: clc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clc_user -d clc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: clc-api
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://clc_user:clc_password_dev@postgres:5432/clc_db
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules

volumes:
  pgdata:
