# Reverse proxy for production. Terminate TLS at this layer (cert volume
# mounted in Phase 10 deploy). For Phase 0 this file just documents intent.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Trust X-Forwarded-* from a known proxy if you add a CDN/LB upstream.
  server_tokens off;
  client_max_body_size 10m;

  upstream clc_api {
    server api:3000;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass         http://clc_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-Id      $request_id;
      proxy_read_timeout 30s;
    }

    location = / {
      return 200 'CLC API gateway is up';
      add_header Content-Type text/plain;
    }
  }
}
